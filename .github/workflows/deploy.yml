name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main # Triggers the workflow when you push to the main branch

permissions:
  contents: write # Allows the workflow to push the build files to the gh-pages branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 # Match your Node version
          cache: 'npm'
          # Points to the frontend lock file so npm cache works properly
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Dependencies
        # Navigates into the frontend folder to install packages
        working-directory: ./frontend
        run: npm ci

      - name: Build Application
        working-directory: ./frontend
        run: npm run build
        env:
          # Pass production environment variables here if needed at build time
          REACT_APP_API_URL: https://onrender.com 
          # If using Vite, use: VITE_API_URL: https://onrender.com

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          # Targets the build folder inside the frontend directory
          folder: frontend/dist # Change to 'frontend/dist' if you are using Vite
          branch: gh-pages # The branch the action will deploy to
